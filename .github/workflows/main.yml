name: Create Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source zip
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          zip -r "source.${TAG_NAME}.zip" . \
            -x ".git/*" \
            -x ".github/*"

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          files: source.${{ github.ref_name }}.zip
          generate_release_notes: true
