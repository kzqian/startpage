name: Create Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          files: index.html
          generate_release_notes: true
